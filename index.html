<style>
        :root {
            --primary: #1976d2;
            --bg: #ececec;
            --card: #f0f0f0;
            --border: #bfbfbf;
            --text-main: #000000;
            --text-muted: #333333;
            --green-bg: #d4edda;
            --green-text: #155724;
            --red-bg: #f8d7da;
            --red-text: #721c24;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        /* 1. Teljes képernyős, fix nézet (nincs külső görgetés) */
        body {
            margin: 0;
            background: #d8d8d8;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 8px;
        }

        .app-window {
            width: 100%;
            height: 100%;
            max-width: 960px;
            max-height: 700px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* FEJLÉC (fix magasságú, nem zsugorodik) */
        .header {
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-shrink: 0;
            border-bottom: 1px solid #d0d0d0;
        }

        .header-left div {
            font-size: 14px;
            margin-bottom: 3px;
        }

        .header-right {
            text-align: right;
            max-width: 55%;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.3;
        }

        /* TÖRZS (rugalmasan kitölti a maradék helyet) */
        .body-content {
            padding: 12px 25px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Megakadályozza a túlcsordulást */
        }

        #questionPanel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .nav-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .next-btn {
            background: #e1e1e1;
            border: 1px solid #707070;
            border-radius: 2px;
            padding: 4px 22px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .next-btn:active {
            background: #bcbcbc;
        }

        .question-text {
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            margin: 5px 0 12px 0;
            line-height: 1.35;
            flex-shrink: 0;
        }

        /* 2. Válaszok doboza: ha sok a szöveg, csak ezen belül jelenik meg görgetősáv */
        .answers-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
            margin-bottom: 10px;
        }

        .answer-btn {
            background: #fff;
            border: 1px solid #7f7f7f;
            border-radius: 2px;
            padding: 12px 16px;
            font-size: 14px;
            text-align: center;
            cursor: pointer;
            outline: none;
            line-height: 1.3;
            flex-shrink: 0;
        }

        .answer-btn:hover:not(:disabled) {
            background: #f7f7f7;
        }

        .answer-btn.correct {
            background: var(--green-bg) !important;
            border-color: #28a745 !important;
            color: var(--green-text) !important;
            font-weight: bold;
        }

        .answer-btn.incorrect {
            background: var(--red-bg) !important;
            border-color: #dc3545 !important;
            color: var(--red-text) !important;
        }

        /* EREDMÉNY TÁBLÁZAT */
        .results-fieldset {
            border: 1px solid #9e9e9e;
            border-radius: 3px;
            padding: 10px 20px;
            margin: 5px 0 10px 0;
            background: #f0f0f0;
        }

        .results-fieldset legend {
            font-size: 14px;
            font-weight: 500;
            padding: 0 6px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2px;
        }

        .results-table th, .results-table td {
            padding: 6px 8px;
            font-size: 14px;
        }

        .results-table th {
            font-weight: 600;
            text-align: center;
            border-bottom: 1.5px solid #a6a6a6;
        }

        .results-table td {
            text-align: center;
            border-bottom: 1px solid #d0d0d0;
        }

        .results-table td.subject-label {
            text-align: left;
            font-weight: 500;
        }

        .results-table tr.total-row td {
            border-top: 1.5px solid #a6a6a6;
            border-bottom: none;
            font-weight: bold;
        }

        .final-percent {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            margin: 10px 0 5px 0;
        }

        .percent-fail { color: #d32f2f; }
        .percent-pass { color: #2e7d32; }

        /* LÁBLÉC (fix magasságú) */
        .footer {
            padding: 8px 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 13px;
            color: var(--text-muted);
            flex-shrink: 0;
            border-top: 1px solid #d0d0d0;
        }

        .footer-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .question-stats {
            font-size: 12px;
            color: #333;
        }

        .footer-time {
            text-align: right;
            line-height: 1.3;
        }

        /* BEÁLLÍTÁSOK KÉPERNYŐ */
        .setup-screen {
            padding: 30px 20px;
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-content: center;
        }

        .setup-table {
            margin: 15px auto;
            border-collapse: collapse;
        }

        .setup-table th, .setup-table td {
            border: 1px solid var(--border);
            padding: 8px 16px;
            font-size: 14px;
        }

        .setup-table input {
            width: 60px;
            text-align: center;
            font-size: 14px;
            padding: 4px;
        }

        .start-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 32px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .reset-stats-btn {
            margin-top: 12px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 11px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
